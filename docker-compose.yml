services:
  postgres:
    image: postgres:16

    container_name: insightflow-postgres

    environment:
      POSTGRES_USER: insight_admin
      POSTGRES_PASSWORD: insight_password
      POSTGRES_DB: insightflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
